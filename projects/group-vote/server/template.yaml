AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Group Vote API (Lambda function URL + DynamoDB) for corgi-capital.com group trip pages.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://corgi-capital.com
  PhotoMonthlyLimit:
    Type: Number
    Default: 950
    Description: Max Google Place photo loads per month (free allowance is 1,000)
  SearchMonthlyLimit:
    Type: Number
    Default: 4800
    Description: Max Google Places text searches per month (free allowance is 5,000)
  ParamPrefix:
    Type: String
    Default: group-vote
    Description: Parameter Store prefix. /<prefix>/maps-api-key holds the Google Maps browser key and /<prefix>/claude-oauth-token the agent's Claude credential (a claude setup-token OAuth token, or an API key), both SecureString. Standard parameters are free; Secrets Manager charges $0.40 a month per secret.
  AgentAuth:
    Type: String
    Default: subscription
    AllowedValues: [subscription, api]
    Description: subscription (the credential is the owner's Claude subscription, so only the owner's own suggestions run at once and anyone else's wait for the owner's OK) or api (an API key, so everyone's suggestions run)
  ClaudeCodeVersion:
    Type: String
    Default: 2.1.317
  ClaudeCodeSha512:
    Type: String
    Default: sha512-awlwqIvbePCG9zVrlBm5L/3eELJmGJThom+1QgHeBK5N9F1dFpyBQP9M5A8s0PAaWBbLwDIm9SHVmZ6j/TftbA==
    Description: npm dist.integrity of @anthropic-ai/claude-code-linux-arm64 at ClaudeCodeVersion (npm view ... dist.integrity)

Resources:
  VotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  VoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: app.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref VotesTable
          MAPS_PARAM: !Sub "/${ParamPrefix}/maps-api-key"
          AGENT_AUTH: !Ref AgentAuth
          PHOTO_MONTHLY_LIMIT: !Ref PhotoMonthlyLimit
          SEARCH_MONTHLY_LIMIT: !Ref SearchMonthlyLimit
          AGENT_FUNCTION: !Ref AgentFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref VotesTable }
        - LambdaInvokePolicy: { FunctionName: !Ref AgentFunction }
        - SSMParameterReadPolicy: { ParameterName: !Sub "${ParamPrefix}/maps-api-key" }
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref AllowedOrigin, "http://localhost:8080"]
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type]
          MaxAge: 3600

  # Suggest Spot: reviews each suggestion with Claude Code (headless, on the credential in /<ParamPrefix>/claude-oauth-token)
  # and adds the card. Invoked asynchronously by VoteFunction; fetches the Claude Code binary into /tmp on a cold start.
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: agent.handler
      CodeUri: .
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: { Size: 2048 }
      ReservedConcurrentExecutions: 2
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 3600
      Environment:
        Variables:
          TABLE_NAME: !Ref VotesTable
          MAPS_PARAM: !Sub "/${ParamPrefix}/maps-api-key"
          CLAUDE_PARAM: !Sub "/${ParamPrefix}/claude-oauth-token"
          AGENT_AUTH: !Ref AgentAuth
          CLAUDE_CODE_VERSION: !Ref ClaudeCodeVersion
          CLAUDE_CODE_SHA512: !Ref ClaudeCodeSha512
          CLAUDE_MODEL: sonnet
          PHOTO_MONTHLY_LIMIT: !Ref PhotoMonthlyLimit
          SEARCH_MONTHLY_LIMIT: !Ref SearchMonthlyLimit
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref VotesTable }
        - SSMParameterReadPolicy: { ParameterName: !Sub "${ParamPrefix}/maps-api-key" }
        - SSMParameterReadPolicy: { ParameterName: !Sub "${ParamPrefix}/claude-oauth-token" }
        - Statement:
            - Effect: Allow   # hands leftover suggestions to a fresh run of itself (by name, to avoid a circular reference)
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-AgentFunction*"

Outputs:
  VoteApiUrl:
    Description: Paste into projects/group-vote/web/group-vote-config.js as apiUrl
    Value: !GetAtt VoteFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref VotesTable
