AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Group Vote API (Lambda function URL + DynamoDB) for corgi-capital.com group trip pages.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://corgi-capital.com
  PhotoMonthlyLimit:
    Type: Number
    Default: 950
    Description: Max Google Place photo loads per month (free allowance is 1,000)
  SearchMonthlyLimit:
    Type: Number
    Default: 4800
    Description: Max Google Places text searches per month (free allowance is 5,000)
  MapsKeySecretName:
    Type: String
    Default: group-vote/maps-api-key
    Description: Secrets Manager secret holding the Google Maps browser key as a plain string
  ClaudeSecretName:
    Type: String
    Default: group-vote/claude-oauth-token
    Description: Secrets Manager secret holding a Claude Code OAuth token (claude setup-token) as a plain string; the agent runs on that Claude subscription
  ClaudeCodeVersion:
    Type: String
    Default: 2.1.317
  ClaudeCodeSha512:
    Type: String
    Default: sha512-awlwqIvbePCG9zVrlBm5L/3eELJmGJThom+1QgHeBK5N9F1dFpyBQP9M5A8s0PAaWBbLwDIm9SHVmZ6j/TftbA==
    Description: npm dist.integrity of @anthropic-ai/claude-code-linux-arm64 at ClaudeCodeVersion (npm view ... dist.integrity)

Resources:
  VotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  VoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: app.handler
      CodeUri: .
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref VotesTable
          MAPS_SECRET_ID: !Ref MapsKeySecretName
          PHOTO_MONTHLY_LIMIT: !Ref PhotoMonthlyLimit
          SEARCH_MONTHLY_LIMIT: !Ref SearchMonthlyLimit
          AGENT_FUNCTION: !Ref AgentFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref VotesTable }
        - LambdaInvokePolicy: { FunctionName: !Ref AgentFunction }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MapsKeySecretName}-*"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: [!Ref AllowedOrigin, "http://localhost:8080"]
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type]
          MaxAge: 3600

  # Suggest Spot: reviews each suggestion with Claude Code (headless, on the Claude subscription in ClaudeSecretName)
  # and adds the card. Invoked asynchronously by VoteFunction; fetches the Claude Code binary into /tmp on a cold start.
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: agent.handler
      CodeUri: .
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: { Size: 2048 }
      ReservedConcurrentExecutions: 2
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 3600
      Environment:
        Variables:
          TABLE_NAME: !Ref VotesTable
          MAPS_SECRET_ID: !Ref MapsKeySecretName
          CLAUDE_SECRET_ID: !Ref ClaudeSecretName
          CLAUDE_CODE_VERSION: !Ref ClaudeCodeVersion
          CLAUDE_CODE_SHA512: !Ref ClaudeCodeSha512
          CLAUDE_MODEL: sonnet
          PHOTO_MONTHLY_LIMIT: !Ref PhotoMonthlyLimit
          SEARCH_MONTHLY_LIMIT: !Ref SearchMonthlyLimit
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref VotesTable }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MapsKeySecretName}-*"
                - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ClaudeSecretName}-*"
            - Effect: Allow   # hands leftover suggestions to a fresh run of itself (by name, to avoid a circular reference)
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-AgentFunction*"

Outputs:
  VoteApiUrl:
    Description: Paste into projects/group-vote/web/group-vote-config.js as apiUrl
    Value: !GetAtt VoteFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref VotesTable
